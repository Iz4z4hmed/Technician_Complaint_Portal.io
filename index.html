<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Complaint Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --title-brown: #3d2a1d;
      --btn-brown: #5d3d1e;
      --btn-hover: #452c13;
      --bg-color: #f7f7f8;
      --card-bg: #ffffff;
      --input-bg: #eef0f2;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 16px 10px;
    }

    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-logo-img {
      max-width: 150px;
      height: auto;
      margin-bottom: 8px;
      object-fit: contain;
    }

    .portal-title {
      font-size: 20px;
      color: var(--title-brown);
      margin: 0;
      font-weight: 700;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--title-brown);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--card-bg);
      font-size: 14px;
      font-family: inherit;
      color: #1f2937;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--btn-brown);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--btn-brown);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--btn-hover);
    }

    .btn-submit:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Live Status Alerts */
    .status-alert {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .status-pending {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    .status-scheduled {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
    }

    .status-resolved {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .status-rejected {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>

<div class="header-area">
  <img src="logo.png" alt="Company Logo" class="brand-logo-img">
  <h1 class="portal-title">Technician Maintenance Request</h1>
</div>

<div class="container">
  <form id="complaintForm">
    <div class="form-group">
      <label for="techId">👤 Technician ID / Name</label>
      <input type="text" id="techId" placeholder="Enter your ID or Name" >
    </div>

    <div class="form-group">
      <label for="floorNumber">🏢 Floor Number</label>
      <select id="floorNumber" required>
        <option value="">Select Floor</option>
        <option value="Basement">Basement</option>
        <option value="Ground Floor">Ground Floor</option>
        <option value="Floor 1">Floor 1</option>
        <option value="Floor 2">Floor 2</option>
        <option value="Floor 3">Floor 3</option>
        <option value="Floor 4">Floor 4</option>
        <option value="Floor 5">Floor 5</option>
      </select>
    </div>

    <div class="form-group">
      <label for="roomNumber">🚪 Room Number / Area</label>
      <input type="text" id="roomNumber" placeholder="e.g. Room 502 / Main Lobby" required>
    </div>

    <div class="form-group">
      <label for="category">🛠️ Category</label>
      <select id="category" required>
        <option value="">Select Category</option>
        <option value="Electrical">Electrical</option>
        <option value="Plumbing">Plumbing</option>
        <option value="AC Problem">HVAC / AC</option>
        <option value="Toilet Issue">Carpentry</option>
        <option value="Water Leakage">Civil Work</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">📝 Complaint Description</label>
      <textarea id="description" placeholder="Describe the issue in detail..." required></textarea>
    </div>

    <div class="form-group">
      <label for="photo">📷 Attach Photo (Optional)</label>
      <input type="file" id="photo" accept="image/*">
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">Submit Complaint</button>
  </form>

  <div id="statusBox" class="status-alert"></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwoTBPZFvUSGqS6VYmITjew4P2bkVxPdIJUD0e4Lt5FYslV9JUycSpLvMaM95W3MuF9/exec";
  let activeComplaintId = null;

  // Compress photo before uploading to avoid server timeouts
  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        callback(canvas.toDataURL('image/jpeg', quality));
      };
    };
  }

  document.getElementById('complaintForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Compressing & Submitting...";

    const file = document.getElementById('photo').files[0];

    const sendData = (fileData = null, fileName = null, mimeType = null) => {
      const payload = {
        action: "submit",
        techId: document.getElementById('techId').value,
        floor: document.getElementById('floorNumber').value,
        room: document.getElementById('roomNumber').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        fileData: fileData,
        fileName: fileName,
        mimeType: mimeType
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          activeComplaintId = res.id;
          const statusBox = document.getElementById('statusBox');
          statusBox.className = 'status-alert status-pending';
          statusBox.innerHTML = `Your Complaint <strong>${activeComplaintId}</strong> submitted successfully.<br>Status: <strong>Maintenance Team Will Respond Soon</strong>`;
          statusBox.style.display = 'block';

          document.getElementById('complaintForm').reset();
        } else {
          alert("Script Error: " + (res.message || "Unknown error"));
        }
      })
      .catch((error) => {
        console.error("Fetch Error:", error);
        alert("Submission failed. Please check your internet connection.");
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Submit Complaint';
      });
    };

    if (file) {
      compressImage(file, 1024, 0.7, (compressedDataUrl) => {
        sendData(compressedDataUrl, file.name, 'image/jpeg');
      });
    } else {
      sendData();
    }
  });

  // Polling to update technician on status changes
  setInterval(async () => {
    if (!activeComplaintId) return;

    try {
      const response = await fetch(API_URL);
      const complaints = await response.json();
      const item = complaints.find(c => c.id === activeComplaintId);

      if (item) {
        const statusBox = document.getElementById('statusBox');
        if (item.status === 'Resolved') {
          statusBox.className = 'status-alert status-resolved';
          statusBox.innerHTML = `Complaint <strong>${activeComplaintId}</strong> has been <strong>RESOLVED</strong>!`;
        } else if (item.status === 'Rescheduled') {
          statusBox.className = 'status-alert status-scheduled';
          statusBox.innerHTML = `Complaint <strong>${activeComplaintId}</strong> is <strong>RESCHEDULED</strong> for <strong>${item.scheduleDate}</strong>.<br>Reason: <i>${item.rescheduleReason || 'N/A'}</i>`;
        } else if (item.status === 'Rejected') {
          statusBox.className = 'status-alert status-rejected';
          statusBox.innerHTML = `Complaint <strong>${activeComplaintId}</strong> was <strong>REJECTED</strong> by the maintenance team.`;
        }
      }
    } catch (e) { 
      console.error(e); 
    }
  }, 4000);
</script>

</body>
</html>
