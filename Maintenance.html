<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Management Dashboard</title>
  <Link rel="icon" typle="image" href="icon.jpeg">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --title-brown: #3d2a1d;
      --btn-brown: #5d3d1e;
      --btn-hover: #452c13;
      --btn-red: #991b1b;
      --bg-color: #f7f7f8;
      --card-bg: #ffffff;
      --input-bg: #eef0f2;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 12px 8px;
    }

    .header-area {
      text-align: center;
      margin-bottom: 16px;
    }

    .brand-logo-img {
      max-width: 140px;
      height: auto;
      margin-bottom: 6px;
      object-fit: contain;
    }

    .portal-title {
      font-size: 20px;
      color: var(--title-brown);
      margin: 0;
      font-weight: 700;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* Tabs Styling - Horizontal Scroll for Mobile */
    .tabs-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }

    .tab-btn {
      background: #eef0f2;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: var(--title-brown);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background-color: var(--btn-brown);
      color: #ffffff;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--input-bg);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .filter-group input[type="date"] {
      flex: 1;
      min-width: 120px;
    }

    input[type="date"], input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #ffffff;
      font-size: 13px;
    }

    .btn-brown {
      background-color: var(--btn-brown);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-brown:hover { background-color: var(--btn-hover); }

    .btn-red {
      background-color: var(--btn-red);
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }

    .badge-Pending { background: #fef3c7; color: #92400e; }
    .badge-Rescheduled { background: #eff6ff; color: #1d4ed8; }
    .badge-Resolved { background: #dcfce7; color: #15803d; }
    .badge-Rejected { background: #fee2e2; color: #991b1b; }

    .photo-link {
      color: var(--btn-brown);
      font-weight: 600;
      text-decoration: underline;
    }

    /* Desktop Table View */
    @media (min-width: 769px) {
      body { padding: 20px 10px; }
      .container { padding: 20px; }
      .brand-logo-img { max-width: 180px; }
      .portal-title { font-size: 22px; }

      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .btn-brown, .btn-red { width: auto; }

      .table-responsive {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: var(--title-brown);
        font-weight: 700;
        background: #fafafa;
      }
    }

    /* Mobile Responsive Cards Layout */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        margin-bottom: 12px;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      }

      td {
        border: none;
        padding: 6px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        text-align: right;
      }

      td::before {
        content: attr(data-label);
        font-weight: 700;
        color: var(--title-brown);
        text-align: left;
        padding-right: 10px;
        min-width: 110px;
      }

      /* Stack action fields vertically on mobile cards */
      td[data-label="Actions"], td[data-label="Schedule / Reason"] {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px dashed var(--border-color);
      }

      td[data-label="Actions"]::before, td[data-label="Schedule / Reason"]::before {
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>

<div class="header-area">
  <img src="logo.png" alt="Company Logo" class="brand-logo-img">
  <h1 class="portal-title">Maintenance Team Portal</h1>
</div>

<div class="container">
  <!-- Tabs Header -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('Pending', event)">Active Complaints</button>
    <button class="tab-btn" onclick="switchTab('Rescheduled', event)">Rescheduled</button>
    <button class="tab-btn" onclick="switchTab('Resolved', event)">Resolved</button>
    <button class="tab-btn" onclick="switchTab('Rejected', event)">Rejected</button>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <input type="date" id="startDate" onchange="loadComplaints()">
      <span style="font-size:12px; font-weight:600;">to</span>
      <input type="date" id="endDate" onchange="loadComplaints()">
      <button class="btn-brown" onclick="resetFilter()" style="margin-top:4px;">Reset Filter</button>
    </div>
    <button class="btn-brown" onclick="exportExcel()">Export Excel Report</button>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Date</th>
          <th>Tech ID</th>
          <th>Location</th>
          <th>Category</th>
          <th>Description</th>
          <th>Initial Photo</th>
          <th id="thDynamicMeta">Schedule / Reason</th>
          <th>Status</th>
          <th id="thDynamicAction">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>
  
<script>
  const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
  let dataset = [];
  let currentTab = 'Pending';
  let isUserInteracting = false;

  function switchTab(tabName, evt) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    evt.target.classList.add('active');
    renderTable();
  }

  async function loadComplaints() {
    if (isUserInteracting) return;

    try {
      const res = await fetch(API_URL);
      dataset = await res.json();
      renderTable();
    } catch (e) {
      console.error(e);
    }
  }

  function renderTable() {
    if (isUserInteracting) return;

    const tbody = document.getElementById('tableBody');
    const thMeta = document.getElementById('thDynamicMeta');
    const thAction = document.getElementById('thDynamicAction');
    tbody.innerHTML = '';

    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;

    let filtered = dataset.filter(c => {
      let status = c.status || 'Pending';
      if (currentTab === 'Pending') return status === 'Pending';
      if (currentTab === 'Rescheduled') return status === 'Rescheduled';
      if (currentTab === 'Resolved') return status === 'Resolved';
      if (currentTab === 'Rejected') return status === 'Rejected';
      return false;
    });

    if (start) filtered = filtered.filter(c => c.date.startsWith(start) || c.date >= start);
    if (end) filtered = filtered.filter(c => c.date.startsWith(end) || c.date <= end);

    if (thMeta && thAction) {
      if (currentTab === 'Pending') {
        thMeta.innerText = "Schedule / Reason";
        thAction.innerText = "Actions";
      } else if (currentTab === 'Rescheduled') {
        thMeta.innerText = "Rescheduled Info";
        thAction.innerText = "Status";
      } else if (currentTab === 'Resolved') {
        thMeta.innerText = "Resolution Info";
        thAction.innerText = "Status";
      } else {
        thMeta.innerText = "Details";
        thAction.innerText = "Status";
      }
    }

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:20px; color:#666;">No records in ${currentTab}.</td></tr>`;
      return;
    }

    filtered.forEach(c => {
      const initPhoto = c.photoUrl && c.photoUrl.startsWith('http') 
        ? `<a href="${c.photoUrl}" target="_blank" class="photo-link">View Photo</a>` : 'None';

      let metaColumnHtml = '';
      let actionColumnHtml = '';

      if (currentTab === 'Pending') {
        metaColumnHtml = `
          <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
            <input type="date" id="sched-${c.id}" onfocus="isUserInteracting=true" onblur="isUserInteracting=false">
            <input type="text" id="reason-${c.id}" placeholder="Reschedule reason..." onfocus="isUserInteracting=true" onblur="isUserInteracting=false">
            <button class="btn-brown" onclick="saveSchedule('${c.id}')">Save Reschedule</button>
          </div>
        `;
        actionColumnHtml = `
          <div style="display:flex; flex-direction:column; gap:6px; width:100%;">
            <input type="file" id="resPhoto-${c.id}" accept="image/*" onchange="isUserInteracting=true">
            <button class="btn-brown" id="btnDone-${c.id}" onclick="markDone('${c.id}')">Mark Done (Resolve)</button>
            <button class="btn-red" onclick="rejectComplaint('${c.id}')">Reject</button>
          </div>
        `;
      } else if (currentTab === 'Rescheduled') {
        metaColumnHtml = `
          <div style="text-align:right;">
            <strong>Date:</strong> ${c.scheduleDate || 'N/A'}<br>
            <span style="font-size:11px; color:#666;">Reason: ${c.rescheduleReason || 'N/A'}</span>
          </div>
        `;
        actionColumnHtml = `<span style="color:#1d4ed8; font-weight:600;">Rescheduled</span>`;
      } else if (currentTab === 'Resolved') {
        const resPhoto = c.resolutionPhotoUrl && c.resolutionPhotoUrl.startsWith('http')
          ? `<a href="${c.resolutionPhotoUrl}" target="_blank" class="photo-link">View Photo</a>` : 'None';
        metaColumnHtml = `
          <div style="text-align:right;">
            <strong>Photo:</strong> ${resPhoto}<br>
            <span style="font-size:11px; color:#15803d;"><strong>Resolved On:</strong> ${c.resolvedDate || 'N/A'}</span>
          </div>
        `;
        actionColumnHtml = `<span style="color:green; font-weight:600;">Completed</span>`;
      } else {
        metaColumnHtml = `<span>Rejected by team</span>`;
        actionColumnHtml = `<span style="color:red; font-weight:600;">Closed</span>`;
      }

      tbody.innerHTML += `
        <tr>
          <td data-label="ID"><b>${c.id}</b></td>
          <td data-label="Date">${c.date}</td>
          <td data-label="Tech ID">${c.techId}</td>
          <td data-label="Location">${c.floor} - ${c.room}</td>
          <td data-label="Category">${c.category}</td>
          <td data-label="Description">${c.description}</td>
          <td data-label="Initial Photo">${initPhoto}</td>
          <td data-label="Schedule / Reason">${metaColumnHtml}</td>
          <td data-label="Status"><span class="badge badge-${c.status}">${c.status}</span></td>
          <td data-label="Actions">${actionColumnHtml}</td>
        </tr>
      `;
    });
  }

  async function saveSchedule(id) {
    const scheduleDate = document.getElementById(`sched-${id}`).value;
    const reason = document.getElementById(`reason-${id}`).value;

    if (!scheduleDate) return alert('Please select a reschedule date.');
    if (!reason.trim()) return alert('Please provide a reason for rescheduling.');

    isUserInteracting = true;
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "schedule", id: id, scheduleDate: scheduleDate, reason: reason })
    });
    isUserInteracting = false;
    loadComplaints();
  }

  async function markDone(id) {
    const fileInput = document.getElementById(`resPhoto-${id}`);
    const btn = document.getElementById(`btnDone-${id}`);

    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      alert('Resolution photo upload is mandatory to mark a complaint as done.');
      return;
    }

    const file = fileInput.files[0];
    btn.disabled = true;
    btn.innerText = "Uploading & Resolving...";
    isUserInteracting = true;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.src = evt.target.result;
      img.onload = async function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > 1024) {
          height = Math.round((height * 1024) / width);
          width = 1024;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

        const payload = {
          action: "markDone",
          id: id,
          resolutionPhotoData: compressedBase64,
          resolutionFileName: file.name,
          resolutionMimeType: 'image/jpeg'
        };

        try {
          await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
        } catch(err) {
          console.error(err);
          alert("Failed to submit. Check network connection.");
        } finally {
          isUserInteracting = false;
          loadComplaints();
        }
      };
    };
    reader.readAsDataURL(file);
  }

  async function rejectComplaint(id) {
    if (!confirm('Are you sure you want to reject this complaint?')) return;

    isUserInteracting = true;
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "reject", id: id })
    });
    isUserInteracting = false;
    loadComplaints();
  }

  function resetFilter() {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    isUserInteracting = false;
    loadComplaints();
  }

  function exportExcel() {
    if (!dataset.length) return alert('No data to export.');
    const ws = XLSX.utils.json_to_sheet(dataset);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Complaints_Full");
    XLSX.writeFile(wb, `Maintenance_Export.xlsx`);
  }

  loadComplaints();
  setInterval(loadComplaints, 5000);
</script>
</body>
</html>
